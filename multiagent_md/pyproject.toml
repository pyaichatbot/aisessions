[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multiagent_md"
version = "0.1.0"
description = "Md-first multi-agent team with harness"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39",
    "pyyaml>=6",
    "gitpython>=3.1",
    "tenacity>=8",
    "rich>=13",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
multiagent-md = "multiagent_md.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["multiagent_md*"]
